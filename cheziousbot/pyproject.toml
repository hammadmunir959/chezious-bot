[project]
name = "chezious-bot"
version = "0.1.0"
description = "Chezious AI Agent backend using LangGraph and Qwen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlmodel>=0.0.20",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.3.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "redisvl>=0.3.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "httpx>=0.24.0",
    "slowapi>=0.1.9",
    "langgraph-checkpoint-redis>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ipykernel>=6.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
